<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>SysGrid · Color studies 02</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202020; background: #efefef; }
    body { margin: 0; background: #efefef; color: #202020; font-size: 14px; line-height: 1.45; }
    button { font: inherit; }
    .page { width: min(1600px, calc(100% - 72px)); margin: 0 auto; padding: 42px 0 64px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #d5d5d5; padding-bottom: 15px; color: #666; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .masthead strong { color: #222; font-weight: 800; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 32px; padding: 34px 0 24px; }
    h1 { margin: 0; color: #202020; font-size: clamp(32px, 3vw, 44px); font-weight: 600; letter-spacing: -.045em; line-height: 1.05; }
    .intro p { margin: 10px 0 0; color: #666; font-size: 14px; }
    .edition { flex: 0 0 auto; color: #666; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .selection { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 15px; border-top: 1px solid #d5d5d5; border-bottom: 1px solid #d5d5d5; padding: 11px 0; }
    .selection-copy { color: #666; font-size: 12px; }
    .selection-copy strong { color: #282828; font-weight: 700; }
    .actions { display: flex; gap: 7px; }
    .quiet-button { min-height: 31px; border: 1px solid #c8c8c8; border-radius: 5px; background: transparent; padding: 0 10px; color: #393939; font-size: 11px; cursor: pointer; }
    .quiet-button:hover { background: #e5e5e5; }
    .directions { display: grid; gap: 11px; }
    .direction { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 17px; border: 1px solid #d5d5d5; border-radius: 9px; background: #f5f5f5; padding: 13px; transition: border-color .15s, box-shadow .15s; }
    .direction.is-selected { border-color: #555; box-shadow: 0 0 0 2px rgb(0 0 0 / 7%); }
    .meta { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; padding: 4px 3px; }
    .index { color: #777; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .07em; }
    h2 { margin: 8px 0 3px; color: #252525; font-size: 17px; font-weight: 650; letter-spacing: -.025em; }
    .note { margin: 0; color: #696969; font-size: 11px; }
    .tokens { display: grid; gap: 7px; margin: 13px 0 12px; }
    .token-set { display: flex; align-items: center; gap: 5px; }
    .token-set label { width: 36px; color: #777; font-size: 9px; letter-spacing: .07em; text-transform: uppercase; }
    .swatch { width: 19px; height: 19px; border: 1px solid rgb(0 0 0 / 16%); border-radius: 4px; }
    .token-value { margin-top: 2px; color: #777; font: 9px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pick { min-height: 32px; margin-top: auto; border: 1px solid #bfbfbf; border-radius: 5px; background: transparent; padding: 0 10px; color: #353535; font-size: 11px; font-weight: 650; cursor: pointer; }
    .pick:hover { background: #e8e8e8; }
    .direction.is-selected .pick { border-color: #333; background: #333; color: #fff; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; min-width: 0; }
    .mode { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); }
    .mode-label { display: flex; align-items: center; justify-content: space-between; height: 26px; border-bottom: 1px solid var(--line); padding: 0 9px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .1em; }
    .mode-label span:last-child { font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; }
    .shell { display: grid; height: 185px; grid-template-columns: 102px minmax(0, 1fr); background: var(--page); }
    .nav { display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); background: var(--raised); padding: 9px 7px; }
    .brand { display: flex; align-items: center; gap: 6px; margin: 0 0 7px 2px; color: var(--ink); font-size: 8px; font-weight: 800; letter-spacing: .09em; }
    .mark { display: grid; width: 16px; height: 16px; place-items: center; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); font-size: 8px; }
    .nav-item { display: flex; align-items: center; gap: 6px; height: 22px; border-radius: 3px; padding: 0 5px; color: var(--muted); font-size: 8px; }
    .nav-item.active { border-left: 2px solid var(--accent); border-radius: 0; padding-left: 3px; color: var(--accent); font-weight: 700; }
    .nav-mark { width: 5px; height: 5px; border: 1px solid currentColor; border-radius: 1px; }
    .nav-item.active .nav-mark { background: var(--accent); }
    .main { min-width: 0; overflow: hidden; padding: 9px 11px; }
    .topline { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 8px; }
    .user { display: grid; width: 17px; height: 17px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); font-size: 6px; font-weight: 700; }
    .page-title { display: flex; align-items: center; justify-content: space-between; margin: 9px 0 8px; }
    .page-title small { display: block; color: var(--muted); font-size: 6px; letter-spacing: .09em; text-transform: uppercase; }
    .page-title strong { display: block; color: var(--ink); font-size: 12px; font-weight: 650; letter-spacing: -.02em; }
    .add { border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); padding: 5px 8px; color: var(--accent-ink); font-size: 7px; font-weight: 700; }
    .summary { display: flex; gap: 17px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; color: var(--muted); font-size: 7px; }
    .summary b { margin-left: 3px; color: var(--ink); font-size: 9px; font-weight: 650; }
    .summary .signal { color: var(--accent); }
    .table { margin-top: 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
    .row { display: grid; grid-template-columns: 1.4fr .85fr .7fr; gap: 6px; align-items: center; min-height: 25px; border-bottom: 1px solid var(--line); padding: 0 7px; color: var(--muted); font-size: 7px; }
    .row:last-child { border-bottom: 0; }
    .row.head { min-height: 21px; color: var(--muted); font-size: 6px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .row strong { overflow: hidden; color: var(--ink); font-size: 7px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .status { color: var(--accent); font-size: 7px; font-weight: 650; }

    @media (max-width: 1080px) {
      .page { width: min(100% - 32px, 820px); padding-top: 24px; }
      .direction { grid-template-columns: 1fr; }
      .meta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center; }
      .index { grid-row: span 2; }
      h2, .note { grid-column: 2; }
      h2 { margin: 0; }
      .tokens, .token-value { grid-column: 2 / 4; }
      .tokens { margin: 8px 0; }
      .pick { grid-column: 3; grid-row: 1 / 3; }
    }
    @media (max-width: 640px) {
      .intro { align-items: flex-start; flex-direction: column; }
      .edition { display: none; }
      .selection { align-items: flex-start; flex-direction: column; }
      .pair { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="masthead"><span><strong>SYSGRID</strong> &nbsp; Color system</span><span>02 &nbsp; / &nbsp; Palette review</span></div>
    <header class="intro">
      <div><h1>Monochrome. Blue, sparingly.</h1><p>White, gray, and black surfaces. Five blue accents in light and dark.</p></div>
      <div class="edition">5 palettes &nbsp; / &nbsp; light + dark</div>
    </header>
    <section class="selection" aria-live="polite">
      <div class="selection-copy" id="selection-copy"><strong>No selection.</strong> Choose one palette pair.</div>
      <div class="actions"><button class="quiet-button" id="copy-choice" type="button">Copy selection</button><button class="quiet-button" id="clear-choice" type="button">Clear</button></div>
    </section>
    <div class="directions" id="directions"></div>
  </main>
  <script>
    const options = [
      { id: 'cobalt', index: '01', name: 'Cobalt', note: 'Royal blue · crisp', light: ['#f4f4f4','#ffffff','#ebebeb','#202020','#6d6d6d','#d8d8d8','#2858c9','#ffffff'], dark: ['#161616','#202020','#292929','#ececec','#a6a6a6','#3a3a3a','#6c90e0','#101010'] },
      { id: 'navy', index: '02', name: 'Navy', note: 'Deep blue · restrained', light: ['#f2f2f2','#fcfcfc','#e7e7e7','#1b1b1b','#6d6d6d','#d4d4d4','#245b96','#ffffff'], dark: ['#1a1a1a','#242424','#2c2c2c','#ededed','#a5a5a5','#3e3e3e','#7da9d5','#121212'] },
      { id: 'steel', index: '03', name: 'Steel', note: 'Muted blue · measured', light: ['#f5f5f5','#ffffff','#ececec','#242424','#737373','#d9d9d9','#4b78a0','#ffffff'], dark: ['#141414','#202020','#282828','#ededed','#a4a4a4','#383838','#8dbbce','#111111'] },
      { id: 'azure', index: '04', name: 'Azure', note: 'Clear blue · precise', light: ['#f1f1f1','#fafafa','#e6e6e6','#1f1f1f','#696969','#d3d3d3','#1674c8','#ffffff'], dark: ['#161616','#222222','#2a2a2a','#ededed','#a2a2a2','#3a3a3a','#75b9ff','#111111'] },
      { id: 'indigo', index: '05', name: 'Indigo', note: 'Blue-indigo · signature', light: ['#f4f4f4','#ffffff','#e8e8e8','#222222','#707070','#d7d7d7','#5866c2','#ffffff'], dark: ['#161616','#222222','#2a2a2a','#ededed','#a5a5a5','#3a3a3a','#a1a9ff','#111111'] },
    ];
    const cssVars = c => `--page:${c[0]};--surface:${c[1]};--raised:${c[2]};--ink:${c[3]};--muted:${c[4]};--line:${c[5]};--accent:${c[6]};--accent-ink:${c[7]}`;
    const sample = (colors, mode) => `
      <section class="mode" style="${cssVars(colors)}" aria-label="${mode} mode preview">
        <div class="mode-label"><span>${mode}</span><span>${colors[0]} &nbsp; / &nbsp; ${colors[6]}</span></div>
        <div class="shell">
          <aside class="nav"><div class="brand"><span class="mark">S</span> SYSGRID</div>
            <div class="nav-item"><i class="nav-mark"></i>Overview</div><div class="nav-item active"><i class="nav-mark"></i>Assets</div><div class="nav-item"><i class="nav-mark"></i>Racks</div><div class="nav-item"><i class="nav-mark"></i>Services</div><div class="nav-item"><i class="nav-mark"></i>Projects</div>
          </aside>
          <div class="main"><div class="topline"><span>Infrastructure &nbsp; / &nbsp; Assets</span><span class="user">HK</span></div>
            <div class="page-title"><div><small>Inventory</small><strong>Asset registry</strong></div><button class="add">＋ &nbsp; Add asset</button></div>
            <div class="summary"><span>Assets <b>1,284</b></span><span>In service <b>1,261</b></span><span>Review <b class="signal">08</b></span></div>
            <div class="table"><div class="row head"><span>Asset</span><span>Site</span><span>State</span></div>
              <div class="row"><strong>Core network switch</strong><span>DC-01</span><span class="status">Operational</span></div>
              <div class="row"><strong>Backup appliance</strong><span>DC-02</span><span class="status">Review</span></div>
              <div class="row"><strong>Compute node 18</strong><span>DC-01</span><span>Operational</span></div>
            </div>
          </div>
        </div>
      </section>`;
    const root = document.querySelector('#directions');
    for (const option of options) {
      const card = document.createElement('article');
      card.className = 'direction';
      card.dataset.id = option.id;
      card.innerHTML = `
        <div class="meta"><span class="index">${option.index}</span><h2>${option.name}</h2><p class="note">${option.note}</p>
          <div class="tokens"><div class="token-set"><label>Light</label>${option.light.slice(0,3).map(color => `<span class="swatch" style="background:${color}" title="${color}"></span>`).join('')}</div>
            <div class="token-set"><label>Dark</label>${option.dark.slice(0,3).map(color => `<span class="swatch" style="background:${color}" title="${color}"></span>`).join('')}</div>
            <div class="token-value">Accent &nbsp; ${option.light[6]} &nbsp; / &nbsp; ${option.dark[6]}</div>
          </div><button class="pick" type="button" data-pick="${option.id}">Select palette</button>
        </div><div class="pair">${sample(option.light, 'Light')}${sample(option.dark, 'Dark')}</div>`;
      root.append(card);
    }
    const copy = document.querySelector('#selection-copy');
    const key = 'sysgrid-theme-direction-v2';
    function choose(id) {
      const option = options.find(item => item.id === id);
      if (!option) return;
      localStorage.setItem(key, id);
      document.querySelectorAll('.direction').forEach(card => {
        const selected = card.dataset.id === id;
        card.classList.toggle('is-selected', selected);
        card.querySelector('.pick').textContent = selected ? 'Selected' : 'Select palette';
      });
      copy.innerHTML = `<strong>${option.index} &nbsp; ${option.name}</strong> selected. This preview does not change the app.`;
    }
    document.querySelectorAll('[data-pick]').forEach(button => button.addEventListener('click', () => choose(button.dataset.pick)));
    document.querySelector('#clear-choice').addEventListener('click', () => {
      localStorage.removeItem(key);
      document.querySelectorAll('.direction').forEach(card => { card.classList.remove('is-selected'); card.querySelector('.pick').textContent = 'Select palette'; });
      copy.innerHTML = '<strong>No selection.</strong> Choose one palette pair.';
    });
    document.querySelector('#copy-choice').addEventListener('click', async () => {
      const option = options.find(item => item.id === localStorage.getItem(key));
      if (!option) { copy.innerHTML = '<strong>No selection to copy.</strong>'; return; }
      const text = `${option.index} · ${option.name} — light ${option.light[6]}, dark ${option.dark[6]}`;
      try { await navigator.clipboard.writeText(text); copy.innerHTML = `<strong>Copied.</strong> ${text}`; }
      catch { copy.innerHTML = `<strong>Selection:</strong> ${text}`; }
    });
    const stored = localStorage.getItem(key);
    if (stored) choose(stored);
  </script>
</body>
</html>
