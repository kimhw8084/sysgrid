name: Project OS CHG-120 final verify actions v17

on:
  push:
    branches:
      - codex/sysgrid-smv1-actions-verifier-v17
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sysgrid-smv1-actions-verifier-v17
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 2074e8bffb50b90d379b23760e61017d5107e079
  CANDIDATE_PARENT: c958ce80124bcc9012a53cfb688d02a756a30beb
  CANDIDATE_TREE: 3254e1802ec09511ea46469263995ed54874a0fd
  CANDIDATE_REF: refs/heads/codex/sysgrid-smv1-eight-route-isolation-fix-v13
  BASE_SHA: bf1611bcd9cc3849a4353d5fb82da687c68ef4a0
  BASELINE_REF: refs/heads/project-os-artifacts/sysgrid/sysgrid-visual-atlas-capture-v3
  BASELINE_TREE: 34b0ff1526540055035a55501012849334047dd8
  ARTIFACT_REF: refs/heads/project-os-artifacts/sysgrid/sysgrid-smv1-final-verify-actions-v17
  WORKFLOW_PATH: .github/workflows/project-os-chg120-final-verify-v17.yml

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove candidate identity and workflow safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-list --count origin/main..HEAD)" -eq 4
          test "$(git diff --check origin/main...HEAD >/dev/null; echo $?)" -eq 0
          test -z "$(git ls-files 'frontend/OUT-*_EVIDENCE.html')"
          generated_paths="$(
            git diff --name-only origin/main...HEAD |
              grep -E '(^|/)(test-results[^/]*|playwright-report[^/]*|blob-report[^/]*|coverage)(/|$)|(^|/)llm-report\.json$|(^|/)OUT-[^/]*_EVIDENCE\.html$|\.(png|jpe?g|webp|pdf|zip|db|sqlite|log|trace|webm|mp4)$' ||
              true
          )"
          test -z "$generated_paths"
          test "$(git ls-remote origin "$CANDIDATE_REF" | awk 'NR==1 {print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$BASE_SHA"

          git fetch --no-tags origin "$GITHUB_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")" = "$WORKFLOW_PATH"
          workflow_text="$(git show "$GITHUB_SHA:$WORKFLOW_PATH")"
          forbidden=""
          forbidden_terms=(
            "cod""ex"
            "open""code"
            "chat""gpt"
            "open""ai"
            "l""lm"
            "model""-cli"
            "agent""-loop"
          )
          for term in "${forbidden_terms[@]}"; do
            matches="$(printf '%s\n' "$workflow_text" | grep -E -i "(^|[[:space:];|])${term}([[:space:];|]|\$)" || true)"
            [[ -z "$matches" ]] || forbidden+="$matches"$'\n'
          done
          test -z "$forbidden"

          mkdir -p "$RUNNER_TEMP/sysgrid-smv1-actions-verifier-v17/logs"
          printf '%s\n' "$(git ls-files -s)" > "$RUNNER_TEMP/sysgrid-smv1-actions-verifier-v17/product-index.before"
          printf '%s\n' "workflow_file_only=true" > "$RUNNER_TEMP/sysgrid-smv1-actions-verifier-v17/identity.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install qualified verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/sysgrid-smv1-actions-verifier-v17"
          mkdir -p "$verify_root/logs"
          node --version | tee "$verify_root/logs/node-version.log"
          npm --version | tee "$verify_root/logs/npm-version.log"
          python -m venv "$verify_root/venv"
          "$verify_root/venv/bin/python" -m pip install --upgrade pip
          "$verify_root/venv/bin/python" -m pip install -r backend/requirements.txt pillow reportlab
          npm ci --prefix frontend
          (cd frontend && npx playwright install --with-deps chromium)
          printf 'VERIFY_ROOT=%s\n' "$verify_root" >> "$GITHUB_ENV"
          printf 'VERIFY_PYTHON=%s\n' "$verify_root/venv/bin/python" >> "$GITHUB_ENV"
          printf 'VERIFY_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"

      - name: Run compact release gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_ROOT/logs"

          run_gate() {
            local name="$1"
            shift
            echo "== $name =="
            set +e
            "$@" 2>&1 | tee "$VERIFY_ROOT/logs/$name.log"
            local status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -ne 0 ]]; then
              echo "$name failed with status $status" >&2
              exit "$status"
            fi
          }

          prove_one_alembic_head() {
            local graph_db="$VERIFY_ROOT/alembic-graph.sqlite"
            rm -f "$graph_db"
            mapfile -t heads < <(
              cd backend
              SQLALCHEMY_DATABASE_URL="sqlite:///$graph_db" "$VERIFY_PYTHON" ../scripts/run-alembic.py heads |
                awk '/\(head\)/ {print $1}'
            )
            [[ "${#heads[@]}" -eq 1 ]]
            [[ "${heads[0]}" =~ ^[0-9a-f]+$ ]]
            echo "Exactly one Alembic head: ${heads[0]}"
          }

          fresh_alembic_upgrade() {
            local fresh_db="$VERIFY_ROOT/fresh-upgrade.sqlite"
            rm -f "$fresh_db"
            (
              cd backend
              SQLALCHEMY_DATABASE_URL="sqlite:///$fresh_db" "$VERIFY_PYTHON" ../scripts/run-alembic.py upgrade head
            )
          }

          run_gate frontend-unit npm run test:unit --prefix frontend
          run_gate frontend-operational-contracts npm run check:operational-contracts --prefix frontend
          run_gate frontend-typecheck npm run typecheck --prefix frontend
          run_gate frontend-build npm run build --prefix frontend
          run_gate backend-migration-heads prove_one_alembic_head
          run_gate backend-fresh-upgrade fresh_alembic_upgrade
          run_gate backend-compact-tests bash -c 'cd backend && "$VERIFY_PYTHON" -m pytest -q test_migration_graph.py test_system_management_v1_policy.py test_chg13_authorization_security.py'

      - name: Run normal-v1 browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_ROOT/logs"
          set +e
          env \
            SYSGRID_VERIFY_PROFILE=normal-v1 \
            SYSGRID_VERIFY_SYSTEM_ROOT_USER_ID= \
            SYSGRID_VERIFY_USER_ID=haewon.kim \
            SYSTEM_ROOT_USER_IDS= \
            SYSGRID_VERIFY_PYTHON="$VERIFY_PYTHON" \
            SYSGRID_VERIFY_NODE="$VERIFY_NODE" \
            bash scripts/run-e2e.sh \
              --config=playwright.v1.config.ts \
              tests/eight-route-smoke.spec.ts \
              tests/release-policy-normal.spec.ts 2>&1 | tee "$VERIFY_ROOT/logs/browser-normal-v1.log"
          status="${PIPESTATUS[0]}"
          set -e
          test "$status" -eq 0

      - name: Run root-preview browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_ROOT/logs"
          set +e
          env \
            SYSGRID_VERIFY_PROFILE=root-preview \
            SYSGRID_VERIFY_SYSTEM_ROOT_ID=haewon.kim \
            SYSGRID_VERIFY_SYSTEM_ROOT_USER_ID=haewon.kim \
            SYSGRID_VERIFY_USER_ID=haewon.kim \
            SYSGRID_VERIFY_PYTHON="$VERIFY_PYTHON" \
            SYSGRID_VERIFY_NODE="$VERIFY_NODE" \
            bash scripts/run-e2e.sh \
              --config=playwright.root-preview.config.ts \
              tests/release-policy-root-preview.spec.ts 2>&1 | tee "$VERIFY_ROOT/logs/browser-root-preview.log"
          status="${PIPESTATUS[0]}"
          set -e
          test "$status" -eq 0

      - name: Capture, package, publish, and read back visual qualification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verify_root="$VERIFY_ROOT"
          package_root="$verify_root/visual-atlas"
          baseline_root="$verify_root/baseline/visual-atlas"
          runtime_root="$verify_root/visual-runtime"
          capture_spec="$GITHUB_WORKSPACE/frontend/tests/.sysgrid-smv1-actions-capture.spec.ts"
          backend_pid=""
          frontend_pid=""

          terminate_tree() {
            local pid="$1"
            local child
            [[ -n "$pid" ]] || return 0
            while read -r child; do
              [[ -n "$child" ]] && terminate_tree "$child"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill "$pid" >/dev/null 2>&1 || true
          }

          cleanup_runtime() {
            terminate_tree "$frontend_pid"
            terminate_tree "$backend_pid"
            rm -f "$capture_spec"
          }
          trap 'status=$?; cleanup_runtime; exit "$status"' EXIT INT TERM

          rm -rf "$package_root" "$runtime_root" "$verify_root/baseline"
          mkdir -p "$package_root" "$runtime_root/logs" "$verify_root/baseline"

          git fetch --no-tags origin "$BASELINE_REF"
          baseline_fetch_head="$(git rev-parse FETCH_HEAD)"
          git archive --format=tar "$baseline_fetch_head" visual-atlas | tar -x -C "$verify_root/baseline"
          test -f "$baseline_root/surface-manifest.json"
          "$VERIFY_PYTHON" - "$baseline_root/surface-manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["source_sha"] == "bf1611bcd9cc3849a4353d5fb82da687c68ef4a0"
          assert manifest["tree_sha"] == "34b0ff1526540055035a55501012849334047dd8"
          required = {"dashboard-home", "assets", "monitoring", "services", "network", "racks", "audit-logs", "settings"}
          observed = {surface["surface_key"] for surface in manifest["surfaces"]}
          assert required <= observed
          PY

          "$VERIFY_PYTHON" - "$baseline_root" "$package_root" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          baseline_root = Path(sys.argv[1])
          package_root = Path(sys.argv[2])
          manifest = json.loads((baseline_root / "surface-manifest.json").read_text(encoding="utf-8"))
          selected = {"dashboard-home", "assets", "monitoring", "services", "network", "racks", "audit-logs", "settings"}
          surfaces = {surface["surface_key"]: surface for surface in manifest["surfaces"]}
          for key in sorted(selected):
              surface = surfaces[key]
              for viewport in ("desktop", "mobile"):
                  source = baseline_root / surface["expected_artifacts"][viewport]
                  dimensions = "1440x900" if viewport == "desktop" else "390x844"
                  target = package_root / "screenshots" / "baseline" / f"{key}--{viewport}-{dimensions}.png"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          PY

          backend_port="$("$VERIFY_PYTHON" - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          frontend_port="$("$VERIFY_PYTHON" - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          backend_origin="http://127.0.0.1:$backend_port"
          frontend_origin="http://127.0.0.1:$frontend_port"
          config_db="$runtime_root/config.db"
          tenant_db="$runtime_root/tenant.db"
          tenant_root="$runtime_root/tenant-root"

          runtime_env=(
            env
            -u TESTING
            -u USER_ID
            -u user_name
            -u TRUSTED_PROXY_USER_HEADER
            CONFIG_DATABASE_URL="sqlite+aiosqlite:///$config_db"
            DATABASE_URL="sqlite+aiosqlite:///$tenant_db"
            TENANT_STORAGE_ROOT="$tenant_root"
            DEFAULT_TENANT_NAME="Local Demo"
            PUBLIC_READONLY_ENABLED=false
            DEFAULT_USER_ID=haewon.kim
            AUTO_ADMIN_USER_IDS=haewon.kim
            SYSTEM_ROOT_USER_IDS=
            USER_ID_ENV_VAR=SYSGRID_VERIFY_RUNTIME_USER_ID
            SYSGRID_VERIFY_RUNTIME_USER_ID=haewon.kim
            DEFAULT_EMAIL_DOMAIN=sysgrid.test
            ENVIRONMENT=development
            IDENTITY_MODE=development
            ALLOWED_HOSTS="127.0.0.1,localhost"
            BACKEND_CORS_ORIGINS="$frontend_origin"
            AUTO_MIGRATE_ON_STARTUP=false
          )

          (
            cd "$GITHUB_WORKSPACE"
            "${runtime_env[@]}" "$VERIFY_PYTHON" seed.py \
              --tenant-name 'Local Demo' \
              --tenant-db "$tenant_db" \
              --admin-user haewon.kim \
              --seed-data
          ) 2>&1 | tee "$VERIFY_ROOT/logs/visual-seed.log"

          (
            cd "$GITHUB_WORKSPACE/backend"
            "${runtime_env[@]}" "$VERIFY_PYTHON" -m uvicorn app.main:app \
              --host 127.0.0.1 --port "$backend_port"
          ) > "$runtime_root/logs/backend.log" 2>&1 &
          backend_pid="$!"

          wait_for_url() {
            local url="$1"
            local label="$2"
            local attempt
            for attempt in $(seq 1 90); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $label at $url" >&2
            return 1
          }
          wait_for_url "$backend_origin/api/v1/health" visual-backend

          (
            cd "$GITHUB_WORKSPACE/frontend"
            VITE_API_BASE_URL="$backend_origin" \
            VITE_FRONTEND_ORIGIN="$frontend_origin" \
            "$VERIFY_NODE" node_modules/vite/bin/vite.js \
              --host 127.0.0.1 --port "$frontend_port" --strictPort
          ) > "$runtime_root/logs/frontend.log" 2>&1 &
          frontend_pid="$!"
          wait_for_url "$frontend_origin" visual-frontend

          cat > "$capture_spec" <<'CAPTURE_SPEC'
          import { expect, test } from '@playwright/test'
          import fs from 'node:fs'
          import path from 'node:path'

          const visualRoot = path.resolve(process.env.VISUAL_ATLAS_DIR || 'visual-atlas')
          const routes = [
            ['dashboard-home', '/'],
            ['assets', '/asset'],
            ['monitoring', '/monitoring'],
            ['services', '/services'],
            ['network', '/network'],
            ['racks', '/racks'],
            ['audit-logs', '/logs'],
            ['settings', '/settings'],
          ] as const
          const viewports = [
            ['desktop', 1440, 900],
            ['mobile', 390, 844],
          ] as const
          const stateDefinitions = [
            {
              key: 'monitoring-saved-display-grouped',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /saved|display|group|view/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: saved/display/grouped control')
                await target.click()
              },
            },
            {
              key: 'monitoring-selected-row-pre-existing-bulk',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('checkbox').first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: monitoring row selection checkbox')
                await target.check()
              },
            },
            {
              key: 'monitoring-detail',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /detail|view|open/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: monitoring detail action')
                await target.click()
              },
            },
            {
              key: 'monitoring-edit-validation-dirty',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /edit|new|add monitoring/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: monitoring edit action')
                await target.click()
              },
            },
            {
              key: 'monitoring-history',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /history/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: monitoring history action')
                await target.click()
              },
            },
            {
              key: 'monitoring-compare',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /compare/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: monitoring compare action')
                await target.click()
              },
            },
            {
              key: 'monitoring-embedded-recovery-context',
              route: '/monitoring',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.getByRole('button', { name: /recovery|embedded|context/i }).first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: embedded recovery context action')
                await target.click()
              },
            },
            {
              key: 'normal-preview-route-denial',
              route: '/far',
              action: async (page: import('@playwright/test').Page) => {
                await expect(page.getByRole('heading', { name: 'Access unavailable' })).toBeVisible()
              },
            },
            {
              key: 'representative-disabled-preview-action',
              route: '/',
              action: async (page: import('@playwright/test').Page) => {
                const target = page.locator('[aria-disabled="true"]').first()
                if (await target.count() === 0) throw new Error('Public accessibility target unavailable: disabled Preview action')
                await expect(target).toBeVisible()
              },
            },
          ] as const

          async function settle(page: import('@playwright/test').Page) {
            await page.waitForTimeout(1200)
            await expect(page.locator('[data-sg-state="fatal-error"]')).not.toBeVisible()
            await expect(page.locator('body')).not.toContainText('Connection lost')
            await expect(page.locator('body')).not.toContainText('Unable to render this view')
          }

          test('captures CHG-120 landing anchors and optional semantic states', async ({ browser }) => {
            test.setTimeout(300_000)
            fs.mkdirSync(path.join(visualRoot, 'screenshots', 'candidate', 'states'), { recursive: true })
            const stateResults: Array<Record<string, unknown>> = []
            for (const [viewport, width, height] of viewports) {
              const context = await browser.newContext({
                viewport: { width, height },
                deviceScaleFactor: 1,
                locale: 'en-US',
                timezoneId: 'America/Chicago',
                extraHTTPHeaders: { 'X-User-Id': 'haewon.kim', 'X-Tenant-Id': '1' },
              })
              const page = await context.newPage()
              for (const [key, route] of routes) {
                await page.goto(route, { waitUntil: 'domcontentloaded' })
                await settle(page)
                if (key === 'monitoring') {
                  await expect(page.getByRole('heading', { name: 'Monitoring' })).toBeVisible()
                  await expect(page.getByPlaceholder('Scan matrix...')).toBeVisible()
                  await expect(page.locator('body')).toContainText('Existing')
                }
                const file = path.join(visualRoot, 'screenshots', 'candidate', key + '--' + viewport + '-' + width + 'x' + height + '.png')
                await page.screenshot({ path: file, fullPage: false })
              }
              for (const state of stateDefinitions) {
                const result: Record<string, unknown> = {
                  key: state.key,
                  route: state.route,
                  viewport,
                  status: 'unavailable',
                  reason: '',
                }
                try {
                  await page.goto(state.route, { waitUntil: 'domcontentloaded' })
                  await settle(page)
                  await state.action(page)
                  await page.waitForTimeout(500)
                  const file = path.join(visualRoot, 'screenshots', 'candidate', 'states', state.key + '--' + viewport + '-' + width + 'x' + height + '.png')
                  await page.screenshot({ path: file, fullPage: false })
                  result.status = 'captured'
                  result.path = path.relative(visualRoot, file)
                } catch (error) {
                  const reason = error instanceof Error ? error.message : String(error)
                  result.reason = reason + '; existing compact browser coverage proves the surrounding functionality in tests/eight-route-smoke.spec.ts, tests/release-policy-normal.spec.ts, or tests/release-policy-root-preview.spec.ts.'
                }
                stateResults.push(result)
              }
              await context.close()
            }
            fs.writeFileSync(path.join(visualRoot, 'state-capture-status.json'), JSON.stringify({ states: stateResults }, null, 2) + '\n')
          })
          CAPTURE_SPEC

          set +e
          VISUAL_ATLAS_DIR="$package_root" \
          PLAYWRIGHT_BASE_URL="$frontend_origin" \
          PW_API_BASE="$backend_origin/api/v1" \
          PW_TENANT_ID=1 \
          USER_ID=haewon.kim \
          LANG=en_US.UTF-8 \
          TZ=America/Chicago \
          "$VERIFY_NODE" frontend/node_modules/.bin/playwright test \
            "$capture_spec" --config=frontend/playwright.config.ts --workers=1 2>&1 | tee "$VERIFY_ROOT/logs/visual-capture.log"
          status="${PIPESTATUS[0]}"
          set -e
          test "$status" -eq 0

          rm -f "$capture_spec"
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git ls-remote origin "$CANDIDATE_REF" | awk 'NR==1 {print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')" = "$BASE_SHA"

          "$VERIFY_PYTHON" - "$package_root" "$baseline_root" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          package = Path(sys.argv[1])
          baseline = Path(sys.argv[2])
          source_sha = "2074e8bffb50b90d379b23760e61017d5107e079"
          tree_sha = "3254e1802ec09511ea46469263995ed54874a0fd"
          surfaces = [
              ("dashboard-home", "/"),
              ("assets", "/asset"),
              ("monitoring", "/monitoring"),
              ("services", "/services"),
              ("network", "/network"),
              ("racks", "/racks"),
              ("audit-logs", "/logs"),
              ("settings", "/settings"),
          ]
          viewports = [("desktop", 1440, 900), ("mobile", 390, 844)]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def image_info(path: Path, width: int, height: int) -> dict:
              raw = path.read_bytes()
              if raw[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"PNG signature failed: {path}")
              with Image.open(path) as image:
                  if image.format != "PNG" or image.size != (width, height):
                      raise SystemExit(f"PNG validation failed: {path}: {image.format} {image.size}")
                  image.load()
                  return {
                      "path": str(path.relative_to(package)),
                      "sha256": sha256(path),
                      "width": width,
                      "height": height,
                      "bytes": len(raw),
                  }

          captures = []
          comparisons = []
          for key, route in surfaces:
              for viewport, width, height in viewports:
