name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: qualification (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stage: checks, label: checks, artifact: checks, shard: ""}
          - {stage: normal-v1, label: normal-v1 shard 1/3, artifact: normal-v1-1, shard: "1/3"}
          - {stage: normal-v1, label: normal-v1 shard 2/3, artifact: normal-v1-2, shard: "2/3"}
          - {stage: normal-v1, label: normal-v1 shard 3/3, artifact: normal-v1-3, shard: "3/3"}
          - {stage: desktop, label: desktop, artifact: desktop, shard: ""}
          - {stage: role-matrix, label: role-matrix, artifact: role-matrix, shard: ""}
          - {stage: root-preview, label: root-preview, artifact: root-preview, shard: ""}
    env:
      QUALIFICATION_STAGE: ${{ matrix.stage }}
      SYSGRID_VERIFY_SHARD: ${{ matrix.shard }}
      SYSGRID_VERIFY_SYSTEM_ROOT_USER_ID: ci-system-root
      SYSGRID_VERIFY_KEEP_LOGS: "1"
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Check candidate whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          base_sha=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="${PR_BASE_SHA:-}"
              if [[ -z "$base_sha" ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
                echo "Unable to resolve pull request base commit: '$base_sha'." >&2
                exit 1
              fi
              ;;
            push)
              event_before="${EVENT_BEFORE:-}"
              if [[ -n "$event_before" && ! "$event_before" =~ ^0+$ && "$event_before" != "$GITHUB_SHA" ]] \
                && git cat-file -e "$event_before^{commit}" 2>/dev/null; then
                base_sha="$event_before"
              else
                base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
              fi
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF_NAME" == "main" ]]; then
                base_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)"
              else
                if ! git show-ref --verify --quiet refs/remotes/origin/main; then
                  echo "Cannot compare workflow_dispatch candidate: origin/main is unavailable." >&2
                  exit 1
                fi
                base_sha="$(git merge-base "$GITHUB_SHA" origin/main)"
              fi
              ;;
            *)
              echo "Unsupported candidate whitespace event: '$GITHUB_EVENT_NAME'." >&2
              exit 1
              ;;
          esac

          if [[ -z "$base_sha" ]]; then
            if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
              echo "Unable to resolve a candidate base commit for non-root SHA $GITHUB_SHA." >&2
              exit 1
            fi
            base_sha="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          elif ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "Resolved candidate base is not a commit: '$base_sha'." >&2
            exit 1
          fi

          echo "SYSGRID_CANDIDATE_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          git diff --check "$base_sha..$GITHUB_SHA"

      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv backend/venv
          backend/venv/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-cache-dir \
            -r backend/requirements.lock

      - name: Install Playwright Chromium
        shell: bash
        run: frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Run canonical application verifier
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$GITHUB_WORKSPACE/backend/venv/bin/python" \
          NODE_BIN="$(command -v node)" \
          SYSGRID_VERIFY_SYSTEM_ROOT_USER_ID="$SYSGRID_VERIFY_SYSTEM_ROOT_USER_ID" \
          SYSGRID_VERIFY_KEEP_LOGS="$SYSGRID_VERIFY_KEEP_LOGS" \
          SYSGRID_VERIFY_TEMP_ROOT="$RUNNER_TEMP/sysgrid-verification" \
          "$GITHUB_WORKSPACE/scripts/verify-app.sh" --stage "$QUALIFICATION_STAGE"

      - name: Collect SHA-bound CI evidence
        if: always()
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          QUALIFICATION_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence

          node_version="$(node --version 2>&1 || true)"
          python_bin="$GITHUB_WORKSPACE/backend/venv/bin/python"
          if [[ ! -x "$python_bin" ]]; then
            python_bin="$(command -v python || command -v python3 || true)"
          fi
          python_version="unavailable"
          if [[ -n "$python_bin" ]]; then
            python_version="$("$python_bin" --version 2>&1 || true)"
          fi

          export NODE_VERSION="$node_version"
          export PYTHON_BIN_USED="$python_bin"
          export PYTHON_VERSION="$python_version"
          export HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "sysgrid.application-ci.stage-evidence.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "github_sha": os.environ["GITHUB_SHA"],
              "tested_trigger_sha": os.environ["GITHUB_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_base_sha": os.environ.get("SYSGRID_CANDIDATE_BASE_SHA") or None,
              "pr_base_sha": os.environ.get("PR_BASE_SHA") or None,
              "ref": os.environ["GITHUB_REF"],
              "head_ref": os.environ["HEAD_REF"],
              "node_version": os.environ["NODE_VERSION"],
              "python_bin": os.environ["PYTHON_BIN_USED"],
              "python_version": os.environ["PYTHON_VERSION"],
              "qualification_stage": os.environ["QUALIFICATION_STAGE"],
              "qualification_shard": os.environ.get("SYSGRID_VERIFY_SHARD") or None,
              "qualification_result": os.environ["QUALIFICATION_RESULT"],
          }
          Path("ci-evidence/ci-identity.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          copy_tree() {
            local source="$1"
            local target="$2"
            if [[ -d "$source" ]]; then
              mkdir -p "$target"
              cp -R "$source/." "$target/"
            fi
          }

          copy_tree backend/test-results ci-evidence/backend-test-results
          copy_tree frontend/test-results ci-evidence/frontend-test-results
          copy_tree frontend/test-results-v1 ci-evidence/frontend-test-results-v1
          copy_tree frontend/test-results-desktop ci-evidence/frontend-test-results-desktop
          copy_tree frontend/test-results-root-preview ci-evidence/frontend-test-results-root-preview
          copy_tree frontend/playwright-report ci-evidence/frontend-playwright-report
          copy_tree frontend/playwright-report-desktop ci-evidence/frontend-playwright-report-desktop
          copy_tree frontend/blob-report ci-evidence/frontend-blob-report

          shopt -s nullglob
          runtime_logs=("$RUNNER_TEMP"/sysgrid-verification/sysgrid-verify.*/logs)
          for source in "${runtime_logs[@]}"; do
            runtime_name="$(basename "$(dirname "$source")")"
            copy_tree "$source" "ci-evidence/owned-runtime/$runtime_name"
          done

      - name: Upload SHA-bound CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-ci-${{ matrix.artifact }}-evidence-${{ env.CANDIDATE_SHA }}
          path: ci-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  normal_v1:
    name: qualification (normal-v1)
    needs: qualification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_RESULT: ${{ needs.qualification.result }}
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download original normal browser shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: application-ci-normal-v1-*-evidence-${{ env.CANDIDATE_SHA }}
          path: normal-shards

      - name: Require complete nonoverlapping browser coverage
        shell: bash
        run: python3 scripts/verify-ci-shards.py normal-shards ci-evidence

      - name: Upload verified normal browser union
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-ci-normal-v1-evidence-${{ env.CANDIDATE_SHA }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    needs: [qualification, normal_v1]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_RESULT: ${{ needs.qualification.result }}
      NORMAL_V1_RESULT: ${{ needs.normal_v1.result }}
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require every qualification stage
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$QUALIFICATION_RESULT" != success || "$NORMAL_V1_RESULT" != success ]]; then
            echo "Application qualification is incomplete: stages=$QUALIFICATION_RESULT browser-union=$NORMAL_V1_RESULT" >&2
            exit 1
          fi

      - name: Collect aggregate CI identity
        if: always()
        shell: bash
        env:
          FINAL_REQUIRED_GATE_RESULT: ${{ job.status }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "sysgrid.application-ci.evidence.v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "github_sha": os.environ["GITHUB_SHA"],
              "tested_trigger_sha": os.environ["GITHUB_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "pr_base_sha": os.environ.get("PR_BASE_SHA") or None,
              "qualification_stages": ["checks", "normal-v1", "desktop", "role-matrix", "root-preview"],
              "ref": os.environ["GITHUB_REF"],
              "head_ref": os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"],
              "stage_evidence_artifacts": {
                  stage: f"application-ci-{stage}-evidence-{os.environ['CANDIDATE_SHA']}"
                  for stage in ["checks", "normal-v1", "desktop", "role-matrix", "root-preview"]
              },
              "runtime_provenance": "Each stage receipt records the Node and Python versions actually used.",
              "qualification_result": os.environ["QUALIFICATION_RESULT"],
              "normal_v1_result": os.environ["NORMAL_V1_RESULT"],
              "final_required_gate_result": os.environ["FINAL_REQUIRED_GATE_RESULT"],
          }
          Path("ci-evidence").mkdir(exist_ok=True)
          Path("ci-evidence/ci-identity.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8",
          )
          PY

      - name: Upload aggregate CI identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-ci-evidence-${{ env.CANDIDATE_SHA }}
          path: ci-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
